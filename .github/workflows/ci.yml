name: CI

on:
  push:
    branches:
      - master
      - "feature/**"
      - "fix/**"
    paths:
      - "src/**"
      - "tests/**"
      - "Dockerfile"
      - ".github/workflows/ci.yml"
  pull_request:
    branches:
      - master
    paths:
      - "src/**"
      - "tests/**"
      - "Dockerfile"
      - ".github/workflows/ci.yml"

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Build Docker image
        run: docker build -t kata-tests .

      - name: Run tests
        run: docker run --rm kata-tests
